[project]
name = "bdoalchemy"
version = "0.1.0"
description = "BDO Alchemy Lab — standalone Harmony crafting tracker"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.3.3",
    "streamlit>=1.50.0",
]

[tool.uv]
package = false

[tool.poetry]
package-mode = false

[tool.ruff]
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.pyc",
]

[tool.ruff.lint]
ignore = ["PGH003"]

[tool.ruff.lint.per-file-ignores]
"core/database/connection.py" = ["ANN", "ARG"]
"core/database/repositories/*.py" = ["ANN", "ARG"]
